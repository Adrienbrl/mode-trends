[project]
name = "mode-trends"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bruel.adrien", email = "bruel.adrienpro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
mode-trends = "mode_trends:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
